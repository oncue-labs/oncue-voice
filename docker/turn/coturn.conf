# Reference coturn configuration for OnCue local and container deployments.
# Credentials are intentionally supplied by deployment configuration, not this file.

listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

fingerprint
lt-cred-mech
realm=oncue.local
stale-nonce=600
no-cli
no-multicast-peers
no-loopback-peers
