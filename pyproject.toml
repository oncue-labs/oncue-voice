[project]
name = "oncue-voice"
version = "0.1.0"
description = "Provider-neutral real-time voice service for OnCue"
requires-python = ">=3.11,<3.12"
authors = [{ name = "OnCue Labs" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "openai>=1.0,<3.0",
    "PyJWT[crypto]>=2.9,<3.0",
    "pydantic>=2.7,<3.0",
    "redis>=5.0,<6.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.poetry]
packages = [{ include = "oncue_voice", from = "src" }]

[tool.poetry.group.dev.dependencies]
httpx = ">=0.27,<1.0"
ipykernel = ">=6.29,<7.0"
jupyter = ">=1.0,<2.0"
nbclient = ">=0.10,<1.0"
nbformat = ">=5.10,<6.0"
pytest = ">=8.0,<9.0"
pytest-asyncio = ">=0.23,<1.0"

[project.scripts]
oncue-voice = "oncue_voice.main:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
